# Dual-UR5 cell configuration.
#
# arms.<id>.base is the transform from the cell's `world` frame to that arm's
# base, in metres and fixed-axis roll-pitch-yaw — the same convention a URDF
# <origin> tag uses. Calibration tools can overwrite arm B's transform with
# the measured value.
#
# mount.style = pedestal derives those base transforms from four measurable
# numbers instead (column height, shoulder spacing, outward tilt, pair yaw).
# Any edit to arms.<id>.base by hand or by the wizard switches it to custom.
#
# mount.show_frame only decides whether RViz draws the mast and crossbar. It
# is deliberately independent of style, so a calibrated (custom) cell still
# shows the structure it is bolted to. Set it false for a cell with no mast.
#
# ui.sidebar_side puts the icon rail and its panel on the right or the left
# edge. The rail itself is never hidden, so the way back from a closed sidebar
# is always on screen; only the panel beside it opens and closes.
#
# ui.fullscreen decides whether the panel takes the whole screen or runs in a
# maximised window with the desktop's dock, top bar and title bar still around
# it. False is the default: this panel shares its screen with the desktop it is
# started from. The rail's ⬚ button toggles it (F11 does too) and writes the
# answer back here; --fullscreen and --windowed override it for one run.
#
# motion.backend picks how the 125 Hz coordinated loop talks to the robots:
#   rtde      ur_rtde servoL/servoJ  (default)
#   urscript  a streaming URScript program uploaded to each controller
cell: {name: dual_ur5, world_frame: world}
arms:
  A:
    label: Arm A
    ip: 192.168.250.20
    enabled: true
    ur_type: ur5
    base:
      xyz: [0.0, 0.24, 1.2]
      rpy: [-2.35619449, 0.0, 0.0]
  B:
    label: Arm B
    ip: 192.168.250.30
    enabled: true
    ur_type: ur5
    base:
      xyz: [-0.021006, -0.262333, 1.196767]
      rpy: [2.35682398, -0.00979761, -0.08937293]
mount: {style: custom, column_height: 1.2, spacing: 0.48, tilt_deg: 135.0, tilt_deg_A: null,
  tilt_deg_B: null, rotate_deg_A: 0.0, rotate_deg_B: 0.0, yaw_deg: 0.0, show_frame: true,
  column_radius: 0.06, crossbar_radius: 0.05, pad_radius: 0.075, pad_thickness: 0.022,
  enforce_outward_guard: true}
motion: {backend: urscript, control: joint, allow_uncalibrated_real: true, servo_rate_hz: 125.0,
  servo_lookahead: 0.1, servo_gain: 300.0, servo_accel: 1.2, servo_speed: 0.5, max_force_rise: 100.0,
  max_tcp_force: 400.0, max_pair_drift: 0.004}
calibrated: false
translation_calibrated: true
limits: {jog_lin_max: 0.25, jog_ang_max: 1.0, object_lin_speed: 0.05, object_ang_speed: 0.3}
vision:
  source: realsense
  width: 640
  height: 480
  fps: 30
  serial: null
  warmup: 15
  sim_plane_z: 1.2
  auto_size: false
  box_size: [0.2, 0.1, 0.1]
  box_sizes:
  - [0.2, 0.1, 0.1]
  - [0.2, 0.1, 0.2]
  - [0.2, 0.05, 0.2]
  - [0.195, 0.1, 0.2]
  - [0.1, 0.195, 0.2]
  - [0.6, 0.4, 0.2]
  - [0.1, 0.1, 0.2]
  - [0.1, 0.2, 0.2]
  roi: null
  smoothing: 0.2
  max_reprojection: 4.0
  max_corner_jump: 35.0
  confirm_frames: 4
  hold_frames: 15
  log_enabled: false
  log_dir: logs
  period: 0.0
  camera_to_world:
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
  calibrated: false
  plane_file: config/plane.json
  max_correction: 0.1
  max_correction_deg: 30.0
